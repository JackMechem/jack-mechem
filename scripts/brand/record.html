<!doctype html>

<html><head><meta charset="utf-8">

  html, body { margin: 0; background: #100f0d; }
  .icon { width: var(--s); height: var(--s); display: grid; place-items: center; background: #100f0d; }

</style></head>

<script>
  const q = new URLSearchParams(location.search);
